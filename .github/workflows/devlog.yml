name: Dev Log

on:
  schedule:
    - cron: "13 8 * * *" # 05:13 in São Paulo: opens the day's entry after the night shift
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devlog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open today's entry
        run: python3 scripts/devlog.py new
      - name: Weekly roll-up (last week on Mondays, current week always)
        run: |
          if [ "$(TZ=America/Sao_Paulo date +%u)" = "1" ]; then python3 scripts/devlog.py week --last; fi
          python3 scripts/devlog.py week
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devlog
          git diff --cached --quiet && exit 0
          git commit -m "chore: open dev log for $(TZ=America/Sao_Paulo date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1
